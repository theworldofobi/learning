[project]
name = "asic-design-for-beginners"
version = "0.1.0"
description = "Interactive Sphinx book: ASIC design for beginners"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sphinx==9.2.0",
    "shibuya==2026.7.12",
    "myst-parser==5.1.0",
    "sphinx-design==0.7.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-togglebutton==0.4.5",
    "sphinxcontrib-wavedrom==3.0.4",
    "sphinxcontrib-mermaid==2.1.1",
    "teachbooks-questions==0.4.0", # multiple-choice / short-answer questions
]

[dependency-groups]
dev = [
    "sphinx-autobuild==2025.8.25", # live preview (make livehtml)
]

[tool.uv]
package = false # this is a book, not an installable Python package
